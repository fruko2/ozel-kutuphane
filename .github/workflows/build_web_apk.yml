name: Build web library APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Android APK
        run: bash apk_web/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kutuphane-web-arm64-apk
          path: apk_web/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
